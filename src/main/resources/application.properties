# Application config
spring.application.name=department-store
spring.datasource.url=jdbc:h2:mem:departmentstore;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT validation is opt-in. When enabled, configure the JWKS file and expected claims.
app.security.jwt.enabled=${JWT_AUTH_ENABLED:false}
app.security.jwt.jwk-set-file=${JWT_JWK_SET_FILE:}
app.security.jwt.issuer=${JWT_ISSUER:}
app.security.jwt.audience=${JWT_AUDIENCE:}

# Logging config
logging.file.name=logs/application.log

# Log levels
logging.level.root=INFO
logging.level.com.challenge.department_store=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Rotate and compress archived logs
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{yyyy-MM-dd}.%i.log.zip
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.total-size-cap=150MB
